# Thresholds are lab-scaled: 15s scrape/eval, 5m blocks when a scenario enables them.
groups:
  - name: meta
    rules:
      - { alert: M_PromDown, expr: 'up{job="prom"} == 0', for: 30s }
      - { alert: M_PromRestarted, expr: 'changes(process_start_time_seconds{job="prom"}[15m]) > 0' }
      - { alert: M_WatchdogLost, expr: 'time() - sink_last_received_seconds{alertname="Watchdog"} > 120' }
      - { alert: M_DataHeartbeatLost, expr: 'time() - sink_last_received_seconds{alertname="DataHeartbeat"} > 120' }
      - { alert: M_ScrapeStretched, expr: 'prometheus_target_interval_length_seconds{interval="15s",quantile="0.9"} > 20', for: 1m }
      - { alert: M_TargetDown, expr: 'up{job=~"small|big"} == 0', for: 1m }
      - { alert: M_ScrapeNearTimeout, expr: 'scrape_duration_seconds{job=~"small|big|prometheus"} > 8', for: 1m }
      - { alert: M_RuleGroupSlow, expr: 'prometheus_rule_group_last_duration_seconds{job="prom"} > 0.8 * prometheus_rule_group_interval_seconds{job="prom"}', for: 1m }
      - { alert: M_RuleMissed, expr: 'increase(prometheus_rule_group_iterations_missed_total{job="prom"}[5m]) > 0' }
      - { alert: M_RuleStale, expr: 'time() - prometheus_rule_group_last_evaluation_timestamp_seconds{job="prom"} > 3 * prometheus_rule_group_interval_seconds{job="prom"}', for: 30s }
      - { alert: M_RuleFailures, expr: 'increase(prometheus_rule_evaluation_failures_total{job="prom"}[5m]) > 0' }
      - { alert: M_QuerySaturated, expr: 'prometheus_engine_queries{job="prom"} / prometheus_engine_queries_concurrent_max{job="prom"} > 0.8', for: 1m }
      - { alert: M_NotifyErrors, expr: 'rate(prometheus_notifications_errors_total{job="prom"}[2m]) > 0', for: 30s }
      - { alert: M_NotifyDropped, expr: 'increase(prometheus_notifications_dropped_total{job="prom"}[5m]) > 0' }
      - { alert: M_NoAlertmanager, expr: 'prometheus_notifications_alertmanagers_discovered{job="prom"} < 1', for: 1m }
      - { alert: M_WalFsyncSlow, expr: 'prometheus_tsdb_wal_fsync_duration_seconds{job="prom",quantile="0.99"} > 0.5', for: 1m }
      - { alert: M_WalWriteFailed, expr: 'increase(prometheus_tsdb_wal_writes_failed_total{job="prom"}[5m]) > 0' }
      - { alert: M_CheckpointFailed, expr: 'increase(prometheus_tsdb_checkpoint_creations_failed_total{job="prom"}[30m]) > 0' }
      - { alert: M_WalCorruption, expr: 'prometheus_tsdb_wal_corruptions_total{job="prom"} > 0' }
      - { alert: M_ReloadStalled, expr: 'increase(prometheus_tsdb_reloads_total{job="prom"}[5m]) == 0', for: 3m }
      - { alert: M_CompactionFailed, expr: 'increase(prometheus_tsdb_compactions_failed_total{job="prom"}[10m]) > 0' }
      - { alert: M_AlertFlapping, expr: 'changes(ALERTS_FOR_STATE{alertname!~"M_.*",job!="prom"}[20m]) > 3' }
      - { alert: M_CPUThrottled, expr: 'rate(container_cpu_cfs_throttled_periods_total[1m]) / rate(container_cpu_cfs_periods_total[1m]) > 0.25', for: 1m }
      - { alert: M_MemNearLimit, expr: 'container_memory_working_set_bytes / (container_spec_memory_limit_bytes > 0) > 0.85', for: 30s }
      - { alert: M_OOMKilled, expr: 'increase(container_oom_events_total[10m]) > 0' }
      - { alert: M_QueueTimeHigh, expr: 'prometheus_engine_query_duration_seconds{job="prom",slice="queue_time",quantile="0.9"} > 1', for: 1m }
      - { alert: M_KnownTrueLost, expr: 'time() - sink_last_received_seconds{alertname="KnownTrueCanary"} > 120' }

