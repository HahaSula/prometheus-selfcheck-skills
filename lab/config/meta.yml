global: { scrape_interval: 5s, scrape_timeout: 5s, evaluation_interval: 5s }
rule_files: [/etc/meta/*-rules.yml]
scrape_configs:
  - job_name: prom
    static_configs: [{ targets: ['prom:9090'] }]
  - job_name: am
    static_configs: [{ targets: ['am:9093'] }]
  - job_name: sink
    static_configs: [{ targets: ['sink:9000'] }]
  - job_name: federate
    scrape_interval: 15s
    scrape_timeout: 10s
    honor_labels: true
    metrics_path: /federate
    params:
      'match[]':
        - '{__name__=~"up|scrape_duration_seconds|scrape_samples_scraped|ALERTS|ALERTS_FOR_STATE"}'
    static_configs: [{ targets: ['prom:9090'] }]
  - job_name: cadvisor
    scrape_interval: 10s
    static_configs: [{ targets: ['cadvisor:8080'] }]
    metric_relabel_configs:
      - { source_labels: [name], regex: 'mom-.*-prom', action: keep }
      - { source_labels: [__name__], regex: 'container_(cpu_cfs_throttled_periods_total|cpu_cfs_periods_total|cpu_usage_seconds_total|memory_working_set_bytes|spec_memory_limit_bytes|oom_events_total|fs_writes_total|blkio_device_usage_total|last_seen)', action: keep }
